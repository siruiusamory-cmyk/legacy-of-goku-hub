name: Synchronize, protect and publish catalog
on:
  push:
    branches:
      - main
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
  schedule:
    - cron: 23 7 * * *
  workflow_dispatch: null
permissions: {}
concurrency:
  group: catalog-publisher
  cancel-in-progress: false
jobs:
  synchronize:
    permissions: &a1
      contents: read
      issues: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &a2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - &a3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - &a4
        run: npm ci --ignore-scripts
      - &a5
        id: config
        run: node src/backup-cli.js config
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: read
      - run: node src/backup-cli.js restore .previous
        env: &a6
          GH_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ steps.app.outputs.token }}
      - run: node src/service-cli.js publish
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_DIR: .previous
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate
          path: |-
            .generated/
            !.generated/snapshot/github-cache.json
          retention-days: 30
          if-no-files-found: error
    if: github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch) && vars.PUBLISHING_ENABLED ==
      'true'
  backup:
    needs: synchronize
    permissions: *a1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - *a4
      - *a5
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: write
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate
          path: .generated
      - run: node src/backup-cli.js backup
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ steps.app.outputs.token }}
          BACKUP_SIGNING_KEY: ${{ secrets.BACKUP_SIGNING_KEY }}
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-receipt
          path: .generated/backup-receipt.json
          retention-days: 30
          if-no-files-found: error
  anchor:
    needs: backup
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - *a4
      - *a5
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: read
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backup-receipt
          path: .generated
      - run: node src/backup-cli.js anchor
        env: *a6
  publish:
    needs: anchor
    permissions: *a1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - *a4
      - *a5
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: read
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate
          path: .generated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backup-receipt
          path: .generated
      - run: node src/backup-cli.js verify-publication
        env: *a6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-state
          path: .generated/snapshot/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog
          path: .generated/work/dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-report
          path: .generated/report.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-backup-receipt
          path: .generated/backup-receipt.json
          retention-days: 30
          if-no-files-found: error
  feedback:
    needs: publish
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validation-report
          path: .feedback
      - run: node src/service-cli.js feedback
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
    if: github.event_name == 'issues'
