name: Synchronize, protect and publish catalog
on:
  push:
    branches:
      - main
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
  schedule:
    - cron: 23 7 * * *
  workflow_dispatch: null
permissions: {}
concurrency:
  group: catalog-publisher
  cancel-in-progress: false
jobs:
  synchronize:
    permissions: &a1
      contents: read
      issues: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &a2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - &a3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - &a4
        run: npm ci --ignore-scripts
      - &a5
        id: config
        run: node src/backup-cli.js config
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: read
      - run: node src/backup-cli.js restore .previous
        env: &a6
          GH_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ steps.app.outputs.token }}
      - run: node src/service-cli.js publish
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_DIR: .previous
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate
          include-hidden-files: true
          path: |-
            .generated/
            !.generated/snapshot/github-cache.json
          retention-days: 30
          if-no-files-found: error
    if: github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch) && vars.PUBLISHING_ENABLED ==
      'true' && (github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[Submission]') ||
      startsWith(github.event.issue.title, '[Manifest]') ||
      startsWith(github.event.issue.title, '[Claim]'))
  backup:
    needs: synchronize
    permissions: *a1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - *a4
      - *a5
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: write
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate
          path: .generated
      - run: node src/backup-cli.js backup
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ steps.app.outputs.token }}
          BACKUP_SIGNING_KEY: ${{ secrets.BACKUP_SIGNING_KEY }}
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-receipt
          path: .generated/backup-receipt.json
          retention-days: 30
          if-no-files-found: error
  anchor:
    needs: backup
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - *a4
      - *a5
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: read
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backup-receipt
          path: .generated
      - run: node src/backup-cli.js anchor
        env: *a6
  publish:
    needs: anchor
    permissions: *a1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - *a4
      - *a5
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: read
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate
          path: .generated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backup-receipt
          path: .generated
      - run: node src/backup-cli.js verify-publication
        env: *a6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-state
          path: .generated/snapshot/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog
          path: .generated/work/dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-report
          path: .generated/report.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-backup-receipt
          path: .generated/backup-receipt.json
          retention-days: 30
          if-no-files-found: error
  feedback:
    needs: publish
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validation-report
          path: .feedback
      - run: node src/service-cli.js feedback
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
    if: github.event_name == 'issues'
  notify:
    needs:
      - synchronize
      - backup
      - anchor
      - publish
    if: always() && vars.PUBLISHING_ENABLED == 'true' && (needs.synchronize.result
      == 'failure' || needs.backup.result == 'failure' || needs.anchor.result ==
      'failure' || needs.publish.result == 'failure' || needs.publish.result ==
      'success')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: node tools/notify-operations.js
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_FAILED: ${{ needs.synchronize.result == 'failure' ||
            needs.backup.result == 'failure' || needs.anchor.result == 'failure'
            || needs.publish.result == 'failure' }}
    concurrency:
      group: loghub-operations-alert
      cancel-in-progress: false

  website:
    needs: publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *a2
      - *a3
      - *a4
      - *a5
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: read
      - run: node src/backup-cli.js export .previous
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ steps.app.outputs.token }}
      - run: npm run site:build -- --snapshot .previous
        env:
          SITE_BASE: /legacy-of-goku-hub/
      - run: node src/backup-cli.js config
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website
          path: .site/production/
          retention-days: 30
          if-no-files-found: error
      - if: vars.SITE_DEPLOYMENT_ENABLED == 'true'
        run: node tools/site/check-deployment.js
      - if: vars.SITE_DEPLOYMENT_ENABLED == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .site/production/
  deploy-website:
    needs: website
    if: vars.SITE_DEPLOYMENT_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject a stale source revision before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha')
          test "$current" = "$EXPECTED_SHA"
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
