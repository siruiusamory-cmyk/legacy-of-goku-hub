name: Verify backup health
on:
  schedule:
    - cron: 53 9 * * *
  workflow_dispatch: null
permissions: {}
jobs:
  health:
    if: github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch) && vars.PUBLISHING_ENABLED ==
      'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - id: config
        run: node src/backup-cli.js config
        env:
          GH_TOKEN: ${{ github.token }}
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.BACKUP_APP_ID }}
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository }}
          permission-contents: read
      - run: node src/backup-cli.js health
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ steps.app.outputs.token }}
  notify:
    needs:
      - health
    if: always() && vars.PUBLISHING_ENABLED == 'true' && needs.health.result ==
      'failure'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: node tools/notify-operations.js
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_FAILED: ${{ needs.health.result == 'failure' }}
    concurrency:
      group: loghub-operations-alert
      cancel-in-progress: false
