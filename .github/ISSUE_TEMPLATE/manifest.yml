name: Register repository manifest
description: Add .loghub.json to your repository, then submit only its URL.
title: '[Manifest] '
body:
  - type: markdown
    attributes:
      value: |
        The bot reads .loghub.json from the default branch. Anyone may point to it;
        this does not give the submitter ownership of the listing.
        Trusted repository owners publish automatically; new owners enter review.
        Later manifest edits synchronize daily without another issue.
  - type: input
    id: repository
    attributes:
      label: Repository URL
      placeholder: https://github.com/OWNER/REPO
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Submission method
      options: [Repository manifest]
    validations:
      required: true
